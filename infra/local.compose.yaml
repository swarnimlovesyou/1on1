name: oneonone-local
services:
  judge:
    image: judge0/judge0:1.13.1
    ports: ["127.0.0.1:2358:2358"]
    volumes: ["../.cache/judge0.conf:/judge0.conf:ro"]
    privileged: true
    depends_on:
      judge-db: { condition: service_healthy }
      judge-redis: { condition: service_healthy }
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }
  judge-worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes: ["../.cache/judge0.conf:/judge0.conf:ro"]
    privileged: true
    depends_on:
      judge-db: { condition: service_healthy }
      judge-redis: { condition: service_healthy }
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }
  judge-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${LOCAL_JUDGE_DB_PASSWORD:?Run npm run setup}
    volumes: ["judge-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  judge-redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${LOCAL_JUDGE_REDIS_PASSWORD:?Run npm run setup}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    restart: unless-stopped
volumes:
  judge-data:
