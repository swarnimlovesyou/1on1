spring.application.name=1on1
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.profiles.default=dev
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./.data/oneonone;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d
server.error.include-message=never
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
app.gemini-key=${GEMINI_API_KEY:}
app.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
app.judge-url=${JUDGE0_URL:https://judge0-ce.p.rapidapi.com}
app.judge-key=${JUDGE0_API_KEY:}
app.judge-host=${JUDGE0_RAPIDAPI_HOST:judge0-ce.p.rapidapi.com}
app.seed-demo=${SEED_DEMO:true}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
