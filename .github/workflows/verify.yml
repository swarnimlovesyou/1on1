name: Verify 1on1
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: mvn -B -f backend/pom.xml verify
      - run: npx playwright install --with-deps chromium
      - name: Start local services
        run: |
          (cd backend && mvn -q spring-boot:run > /tmp/1on1-api.log 2>&1) &
          npm run dev > /tmp/1on1-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/system && curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 2
          done
      - run: python scripts/verify_api.py
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-evidence, path: test-results/}
